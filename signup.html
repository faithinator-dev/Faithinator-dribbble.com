<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faithinator: Dribbble project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .btn:hover{
             background-color: #3D3D4E;
        } 

        small{
            font-size: 11px;
        }

    </style>
</head>

<body>

    <div class="container-fluid w-100 h-100">
        <div class="row w-100 h-100">
            <div class="col-8 p-5 h-100 ">
                <nav class="navbar sticky-top">
                    <div class="m-3">
                        <a href="index.html" class="navbar-brand">
                            <img src="images/logo.svg" alt="" width="100px">
                        </a>
                    </div>
                </nav>
                <main class="my-auto mx-auto position-relative" style="height: 400px; width: 600px;">
                    <div class="mx-auto my-auto w-50 h-50 text-center ">
                        <img class="mt-5 Ball rounded-circle" src="dribbleball-logo.svg" alt="" width="60px">
                        <h1 class="fs-2">Welcome Back</h1>

                        <p class="py-2">Create your account and discover world-class design talent.</p>

                        <div class="rounded-pill d-flex border border-1 Py-4 px-2 w-100 mx-auto text-center"> <div class="mx-auto fw-bold p-2">Sign up with Google</div><img src="google.svg" alt="" width="16px" height="16px" class="my-auto"></div>

                        <div class="my-3 mx-auto">or</div>
                        <form action="" method="post">
                            <div class="mb-3">
                                <input type="email"  class="form-control" name="" id="" placeholder="Email or Username" />
                                <!-- <small id="emailHelpId" class="form-text text-muted">Help text</small> -->
                            </div>

                            <button
                                type="submit"
                                class="btn btn-bluedark text-white rounded-pill w-100"
                            >
                                Continue
                            </button>
                            
                        </form>
                        <small class="fs-smaller w-100">
                            By continuing, you agree to our <a href="">Terms</a> and <a href="">Privacy Policy.</a> 
                        </small>
                        <small>
                            Don't have an account? <a href="signin.html">Sign in</a>
                        </small>
                    </div>
                </main>
            </div>
            <div class="col-4 h-100">
                <video class="d-block h-100" muted autoplay loop>
                    <source src="videos/signin-signup video.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </div>
    <div class="text-white fw-bold  position-absolute" style="bottom: 10px; right: 10px;">@glebich</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
